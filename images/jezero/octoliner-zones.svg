<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Octoliner: eight sensors and steering zones</title><desc id="desc">Top view in the robot coordinate frame. Rotate this view when the robot turns.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker></defs><rect width="1000" height="620" rx="16" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="36" y="52" font-size="30" fill="#172b4d" text-anchor="start">Octoliner: eight sensors and steering zones</text><text x="36" y="88" font-size="18" fill="#475569" text-anchor="start">Top view in the robot coordinate frame. Rotate this view when the robot turns.</text><path d="M500,235 L500,145" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/><text x="525" y="182" font-size="22" fill="#172b4d" text-anchor="start">Forward / front</text><rect x="110" y="265" width="80" height="100" rx="12" fill="#dbeafe" stroke="#64748b"/><text x="150" y="325" font-size="32" fill="#172b4d" text-anchor="middle">7</text><rect x="210" y="265" width="80" height="100" rx="12" fill="#dbeafe" stroke="#64748b"/><text x="250" y="325" font-size="32" fill="#172b4d" text-anchor="middle">6</text><rect x="310" y="265" width="80" height="100" rx="12" fill="#dbeafe" stroke="#64748b"/><text x="350" y="325" font-size="32" fill="#172b4d" text-anchor="middle">5</text><rect x="410" y="265" width="80" height="100" rx="12" fill="#dcfce7" stroke="#64748b"/><text x="450" y="325" font-size="32" fill="#172b4d" text-anchor="middle">4</text><rect x="510" y="265" width="80" height="100" rx="12" fill="#dcfce7" stroke="#64748b"/><text x="550" y="325" font-size="32" fill="#172b4d" text-anchor="middle">3</text><rect x="610" y="265" width="80" height="100" rx="12" fill="#ffedd5" stroke="#64748b"/><text x="650" y="325" font-size="32" fill="#172b4d" text-anchor="middle">2</text><rect x="710" y="265" width="80" height="100" rx="12" fill="#ffedd5" stroke="#64748b"/><text x="750" y="325" font-size="32" fill="#172b4d" text-anchor="middle">1</text><rect x="810" y="265" width="80" height="100" rx="12" fill="#ffedd5" stroke="#64748b"/><text x="850" y="325" font-size="32" fill="#172b4d" text-anchor="middle">0</text><text x="250" y="410" font-size="23" fill="#172b4d" text-anchor="middle">LEFT: 7, 6, 5</text><text x="500" y="410" font-size="23" fill="#172b4d" text-anchor="middle">CENTRE: 4, 3</text><text x="750" y="410" font-size="23" fill="#172b4d" text-anchor="middle">RIGHT: 2, 1, 0</text><text x="500" y="475" font-size="23" fill="#172b4d" text-anchor="middle">First scout readings: left = 6 · centre = 3 · right = 1</text><text x="500" y="520" font-size="20" fill="#172b4d" text-anchor="middle">Readings come from analog_read_all(); list indices run from 0 to 7.</text><text x="36" y="594" font-size="16" fill="#64748b" text-anchor="start">METROPOLIA · JEZERO ROVER EXPLORATION · Teaching diagram</text></g></svg>