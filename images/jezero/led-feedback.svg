<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Visual telemetry: from a reading to a light</title><desc id="desc">Use the robot video to observe the physical indicator; use Output for printed messages.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker></defs><rect width="1000" height="620" rx="16" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="36" y="52" font-size="30" fill="#172b4d" text-anchor="start">Visual telemetry: from a reading to a light</text><text x="36" y="88" font-size="18" fill="#475569" text-anchor="start">Use the robot video to observe the physical indicator; use Output for printed messages.</text><rect x="55" y="200" width="270" height="125" rx="14" fill="#e2e8f0"/><text x="190" y="250" font-size="23" fill="#172b4d" text-anchor="middle">Read sensors</text><text x="190" y="287" font-size="18" fill="#172b4d" text-anchor="middle">Detect the marked line</text><path d="M330,265 L355,265" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><rect x="365" y="200" width="270" height="125" rx="14" fill="#e2e8f0"/><text x="500" y="250" font-size="23" fill="#172b4d" text-anchor="middle">Call your function</text><text x="500" y="287" font-size="18" fill="#172b4d" text-anchor="middle">Blink the indicator</text><path d="M640,265 L665,265" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><rect x="675" y="200" width="270" height="125" rx="14" fill="#e2e8f0"/><text x="810" y="250" font-size="23" fill="#172b4d" text-anchor="middle">Observe the LED</text><text x="810" y="287" font-size="18" fill="#172b4d" text-anchor="middle">Visible program feedback</text><circle cx="380" cy="430" r="32" fill="#94a3b8"/><circle cx="620" cy="430" r="32" fill="#facc15" stroke="#ca8a04" stroke-width="4"/><text x="380" y="492" font-size="23" fill="#172b4d" text-anchor="middle">OFF</text><text x="620" y="492" font-size="23" fill="#172b4d" text-anchor="middle">ON</text><text x="500" y="550" font-size="19" fill="#172b4d" text-anchor="middle">Activity output: GPIO 15. This diagram shows the signal, not the LED location.</text><text x="36" y="594" font-size="16" fill="#64748b" text-anchor="start">METROPOLIA · JEZERO ROVER EXPLORATION · Teaching diagram</text></g></svg>