<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Sequential Navigation: four survey waypoints</title><desc id="desc">Follow the numbered waypoints in order. Distances are in centimetres.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker></defs><rect width="1000" height="620" rx="16" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="36" y="52" font-size="30" fill="#172b4d" text-anchor="start">Sequential Navigation: four survey waypoints</text><text x="36" y="88" font-size="18" fill="#475569" text-anchor="start">Follow the numbered waypoints in order. Distances are in centimetres.</text><rect x="100" y="120" width="750" height="400" fill="#fff" stroke="#cbd5e1"/><circle cx="275" cy="360" r="9" fill="#0f766e"/><text x="265" y="390" font-size="20" fill="#172b4d" text-anchor="start">Start</text><text x="265" y="411" font-size="16" fill="#172b4d" text-anchor="start">(35, 60)</text><path d="M275,360 L450,360" stroke="#2563eb" fill="none" stroke-width="5" marker-end="url(#arrow)"/><text x="374.5" y="346.0" font-size="20" fill="#172b4d" text-anchor="start">35 cm</text><circle cx="450" cy="360" r="9" fill="#0f766e"/><text x="440" y="390" font-size="20" fill="#172b4d" text-anchor="start">1</text><text x="440" y="411" font-size="16" fill="#172b4d" text-anchor="start">(70, 60)</text><path d="M450,360 L450,260" stroke="#2563eb" fill="none" stroke-width="5" marker-end="url(#arrow)"/><text x="462.0" y="296.0" font-size="20" fill="#172b4d" text-anchor="start">25 cm</text><circle cx="450" cy="260" r="9" fill="#0f766e"/><text x="440" y="218" font-size="20" fill="#172b4d" text-anchor="start">2</text><text x="440" y="240" font-size="16" fill="#172b4d" text-anchor="start">(70, 35)</text><path d="M450,260 L625,260" stroke="#2563eb" fill="none" stroke-width="5" marker-end="url(#arrow)"/><text x="549.5" y="246.0" font-size="20" fill="#172b4d" text-anchor="start">35 cm</text><circle cx="625" cy="260" r="9" fill="#0f766e"/><text x="615" y="218" font-size="20" fill="#172b4d" text-anchor="start">3</text><text x="615" y="240" font-size="16" fill="#172b4d" text-anchor="start">(105, 35)</text><path d="M625,260 L625,360" stroke="#2563eb" fill="none" stroke-width="5" marker-end="url(#arrow)"/><text x="637.0" y="296.0" font-size="20" fill="#172b4d" text-anchor="start">25 cm</text><circle cx="625" cy="360" r="9" fill="#0f766e"/><text x="615" y="390" font-size="20" fill="#172b4d" text-anchor="start">4</text><text x="615" y="411" font-size="16" fill="#172b4d" text-anchor="start">(105, 60)</text><text x="110" y="555" font-size="18" fill="#172b4d" text-anchor="start">Camera coordinates: X increases rightward; Y increases downward. Start facing right.</text><text x="36" y="594" font-size="16" fill="#64748b" text-anchor="start">METROPOLIA · JEZERO ROVER EXPLORATION · Teaching diagram</text></g></svg>