<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Python Lists: route through three checkpoints</title><desc id="desc">Follow the numbered waypoints in order. Distances are in centimetres.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker></defs><rect width="1000" height="620" rx="16" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="36" y="52" font-size="30" fill="#172b4d" text-anchor="start">Python Lists: route through three checkpoints</text><text x="36" y="88" font-size="18" fill="#475569" text-anchor="start">Follow the numbered waypoints in order. Distances are in centimetres.</text><rect x="100" y="120" width="750" height="400" fill="#fff" stroke="#cbd5e1"/><circle cx="475" cy="240" r="9" fill="#0f766e"/><text x="465" y="198" font-size="20" fill="#172b4d" text-anchor="start">Start</text><text x="465" y="220" font-size="16" fill="#172b4d" text-anchor="start">(75, 30)</text><path d="M475,240 L750,240" stroke="#2563eb" fill="none" stroke-width="5" marker-end="url(#arrow)"/><text x="624.5" y="226.0" font-size="20" fill="#172b4d" text-anchor="start">55 cm</text><circle cx="750" cy="240" r="9" fill="#0f766e"/><text x="740" y="198" font-size="20" fill="#172b4d" text-anchor="start">1</text><text x="740" y="220" font-size="16" fill="#172b4d" text-anchor="start">(130, 30)</text><path d="M750,240 L750,480" stroke="#2563eb" fill="none" stroke-width="5" marker-end="url(#arrow)"/><text x="762.0" y="346.0" font-size="20" fill="#172b4d" text-anchor="start">60 cm</text><circle cx="750" cy="480" r="9" fill="#0f766e"/><text x="740" y="510" font-size="20" fill="#172b4d" text-anchor="start">2</text><text x="740" y="531" font-size="16" fill="#172b4d" text-anchor="start">(130, 90)</text><path d="M750,480 L400,480" stroke="#2563eb" fill="none" stroke-width="5" marker-end="url(#arrow)"/><text x="587.0" y="466.0" font-size="20" fill="#172b4d" text-anchor="start">70 cm</text><circle cx="400" cy="480" r="9" fill="#0f766e"/><text x="390" y="510" font-size="20" fill="#172b4d" text-anchor="start">3</text><text x="390" y="531" font-size="16" fill="#172b4d" text-anchor="start">(60, 90)</text><text x="110" y="555" font-size="18" fill="#172b4d" text-anchor="start">Camera coordinates: X increases rightward; Y increases downward. Start facing right.</text><text x="36" y="594" font-size="16" fill="#64748b" text-anchor="start">METROPOLIA · JEZERO ROVER EXPLORATION · Teaching diagram</text></g></svg>